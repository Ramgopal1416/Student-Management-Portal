      type: object
      required: [students, total, page, limit]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    FaceDataInput:
      type: object
      required: [imageData]
      properties:
        imageData:
          type: array
          items:
            type: string
          description: Array of base64 encoded face images

