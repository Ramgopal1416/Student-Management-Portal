          type: string
        department:
          type: string
        year:
          type: string
        section:
          type: string
        createdAt:
          type: string

    PeriodInput:
      type: object
      required: [name, subject, startTime, endTime, department, year, section]
      properties:
        name:
          type: string
        subject:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        department:
          type: string
